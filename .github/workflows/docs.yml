name: docs

# Every documentation version is a separate Hugo build, published under
# https://go-statistics.github.io/docs/<version>/ on the gh-pages branch, where
# <version> is the minor version of go-statistics/stats the pages describe
# (params.stats.version in hugo.yaml: v0.1.2 -> 0.1), or "main" while it says
# main. Each push to main replaces /docs/<version>/, and /docs/latest/ follows
# the newest. Pull requests build and check, and publish nothing.
#
# The library's pages are not kept in this repository. Every build checks out
# go-statistics/stats at params.stats.version and imports its README.md and
# docs/*.md (scripts/import), so the site says what the library says. While
# the version is "main", a change to the library reaches the site at the next
# daily run below, or at once through workflow_dispatch.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

# The build needs nothing beyond the source. Write access to the repository
# is granted to the deploy job alone, below, so a pull request build cannot
# push to gh-pages.
permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  # sha256 of hugo_${HUGO_VERSION}_linux-amd64.tar.gz, from the release's checksums.txt.
  HUGO_SHA256: "4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169"
  DOCS_URL: "https://go-statistics.github.io/docs"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # themes/hextra (the tannevaled/hextra fork, pinned to a release tag)
          # and branding (go-statistics/brand) are submodules.
          submodules: recursive
          # The whole history: each page's creation and modification come from git.
          fetch-depth: 0

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      # The version label is stats' minor version, read from hugo.yaml ("main"
      # until the first release), and it is the last segment of baseURL: the
      # version selector reads it there. The ref is what gets imported.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          stats=$(hugo config --format json | jq -r '.params.stats.version')
          if [ "${stats}" = main ]; then
            version=main
          else
            version=$(printf '%s\n' "${stats}" | sed -nE 's/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/\1.\2/p')
          fi
          if [ -z "${version}" ]; then
            echo "::error::params.stats.version in hugo.yaml is \"${stats}\", not vMAJOR.MINOR.PATCH or main"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${stats}" >> "$GITHUB_OUTPUT"
          echo "stats ${stats}: documentation version ${version}"

      - name: Checkout go-statistics/stats ${{ steps.version.outputs.ref }}
        uses: actions/checkout@v7
        with:
          repository: go-statistics/stats
          ref: ${{ steps.version.outputs.ref }}
          path: _stats

      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/import/go.mod
          cache: false

      - name: Import the library's documentation
        working-directory: scripts/import
        run: go run . "${GITHUB_WORKSPACE}/_stats" ../../content/en/stats

      # Each page's creation (first commit, followed across renames) and its
      # author, for the page history at its foot (params.page.history).
      - name: Page history
        run: |
          mkdir -p data
          go run github.com/tannevaled/hextra/cmd/pagehistory@v0.21.0 > data/pagehistory.json

      # --panicOnWarning: a deprecated setting or a template warning fails the
      # build rather than scrolling by. A broken {{< relref >}} is an error --
      # which is also what stops a library without its docs/ from being
      # published as an empty site.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: >-
          hugo --gc --minify --panicOnWarning --printPathWarnings
          --baseURL "${DOCS_URL}/${{ steps.version.outputs.version }}/"

      # Internal links and anchors, offline, with the site laid out under
      # /docs/<version>/ as it is served.
      - name: Lay out the site for the link check
        run: |
          mkdir -p _check/docs
          cp -R public "_check/docs/${{ steps.version.outputs.version }}"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/_check
            '_check/docs/**/*.html'
          fail: true

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  # The offline check above proves the site's own links and anchors. An
  # https:// URL is text to it: this job fetches each one the pages name,
  # the imported ones included.
  links:
    name: every external link resolves
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: The stats version the pages describe
        id: version
        run: |
          ref=$(sed -nE 's/^    version: "(v[0-9.]+|main)"$/\1/p' hugo.yaml)
          test -n "${ref}" || { echo "::error::no params.stats.version in hugo.yaml"; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: go-statistics/stats
          ref: ${{ steps.version.outputs.ref }}
          path: _stats
      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/import/go.mod
          cache: false
      - name: Import the library's documentation
        working-directory: scripts/import
        run: go run . "${GITHUB_WORKSPACE}/_stats" ../../content/en/stats
      # linkcheck (go-fleettools/fleettools, pinned): retries with exponential
      # backoff that honours Retry-After, github.com repo and path links decided
      # through the REST API rather than the HTML page, a DEAD link told apart
      # from a FLAKY host. It already skips img.shields.io, example domains
      # and localhost.
      #
      # --skip: this site's own pages exist only once this workflow has
      # deployed them (the offline check above proves every link inside the
      # site); this repository's own files, on a pull request that adds them,
      # are not on main yet; and the "Edit this page" targets, which answer
      # only to a signed-in browser (the file each names is checked through
      # the blob links the import writes).
      #
      # THE ONE DELIBERATE EXCEPTION to "no secret on a command line or in the
      # environment": the job's ephemeral, read-only github.token (permissions:
      # contents: read, for this job alone) reaches the tool as a 0600 file in
      # RUNNER_TEMP, written by the shell builtin printf (no process argument,
      # no environment variable) and removed on exit. It is sent to
      # api.github.com only and never printed.
      - name: Check
        run: |
          umask 077
          token="${RUNNER_TEMP}/linkcheck-token"
          trap 'rm -f "${token}"' EXIT
          printf '%s' '${{ github.token }}' > "${token}"
          go run github.com/go-fleettools/fleettools/cmd/linkcheck@v0.74.0 \
            --token-file "${token}" \
            --skip go-statistics.github.io/docs \
            --skip github.com/go-statistics/docs/ \
            --skip github.com/go-statistics/stats/edit/ \
            content/ README.md

  deploy:
    # Only main publishes (a push, the daily run or a manual one). A pull
    # request stops after build above: it has no business pushing to gh-pages.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Never two deploys at once: both would push gh-pages and the second would
    # be rejected. cancel-in-progress stays false -- killing a publish half way
    # through is worse than making it wait.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publishing script, from the commit being published.
      - uses: actions/checkout@v7
        with:
          path: source

      # The published site. Only the version being built is replaced; every
      # other version stays as it is. The first deploy finds no gh-pages
      # branch and starts it empty (orphan): nothing else ever creates it.
      - uses: actions/checkout@v7
        with:
          path: gh-pages
          fetch-depth: 0

      - name: Switch to gh-pages
        working-directory: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
          else
            echo "no gh-pages branch yet: starting one"
            git checkout -q --orphan gh-pages
            git rm -rqf .
            git clean -fdxq
          fi

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Publish ${{ needs.build.outputs.version }}
        run: source/scripts/publish-version.sh "${{ needs.build.outputs.version }}" site gh-pages

      - name: Push gh-pages
        working-directory: gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "Deployed ${GITHUB_SHA::7} to ${{ needs.build.outputs.version }} with Hugo ${HUGO_VERSION}"
          git push origin HEAD:gh-pages

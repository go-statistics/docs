# go-statistics documentation (Hugo + Hextra), built like go-plot/docs.
#
# Each documentation version is a separate build under
# https://go-statistics.github.io/docs/<version>/, where <version> is the
# minor version of go-statistics/stats the pages describe (0.1, 0.2, ...), or
# "main" while it has no release. The CI sets it through --baseURL, from
# params.stats.version below. This default is the same build.
#
# The pages of the library (content/en/stats/) are not kept here: the CI
# checks out go-statistics/stats at params.stats.version and imports its
# README.md and docs/*.md with scripts/import before every build.
baseURL: "https://go-statistics.github.io/docs/main/"
title: "go-statistics"
# themes/hextra is the tannevaled/hextra fork, pinned at a release tag:
# upstream Hextra plus opt-in features (partial menu items, combos,
# related-sites menu, page subtitle and history, darkreaderLock).
theme: hextra

# English is the default language and stays at the root of each version.
# Another language would live under its code, with content/<lang>/.
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the bottom of each page.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        title: true
  highlight:
    noClasses: false

module:
  hugoVersion:
    extended: false
    min: 0.146.0
  # The marks and favicons come from the go-statistics brand repository
  # (submodule branding/), published under /images/brand/. Only the org mark's
  # colour formats are mounted.
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
    - source: branding/svg/color
      target: static/images/brand/svg
      files: ["go-statistics.svg"]
    - source: branding/png/color
      target: static/images/brand/png
      files: ["*/go-statistics.png"]
    - source: branding/ico
      target: static/images/brand/ico
      files: ["go-statistics.ico"]

menu:
  main:
    # Navbar, left to right: version, theme, search, sources.
    - name: Version
      weight: 3
      params:
        type: partial
        partial: components/version-select.html
    - name: Theme
      weight: 4
      params:
        type: theme-toggle
        combo: true
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/go-statistics
      weight: 6
      params:
        icon: github

params:
  description: "Probability distributions, descriptive statistics and statistical tests in pure Go (CGO=0), on go-ndarray."

  # The go-statistics/stats these pages describe: a release tag (vMAJOR.MINOR.PATCH)
  # or "main". It is what the CI checks out and imports, and its minor
  # version is the documentation's version label (v0.1.2 -> 0.1; main -> main).
  stats:
    version: "v0.1.0"
  versions:
    # The version selector shows "main" with the development icon.
    development: "main"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      # The amber mark reads on both themes; the name is the site title.
      path: images/brand/svg/go-statistics.svg
      dark: images/brand/svg/go-statistics.svg
      width: 32
      height: 32
      # Related sites, opened from the chevron beside the title (the logo itself
      # leads to the documentation's home).
      menu:
        - name: go-statistics
          url: https://go-statistics.github.io/
          logo: images/brand/svg/go-statistics.svg

  theme:
    default: system
    # The theme toggle is in the navbar (menu above), not at the foot of the sidebar.
    displayToggle: false
    # Dark Reader would darken the light theme itself; with the lock, the dark
    # theme is our own.
    darkreaderLock: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  editURL:
    enable: true
    base: "https://github.com/go-statistics/docs/edit/main/content"

  toc:
    displayTags: true

  page:
    width: normal
    # The front matter description as a subtitle under the title.
    displayDescription: true
    # "Created on ... by ... · Modified on ... by ..." at the foot of each page:
    # creation from data/pagehistory.json, which the build writes with
    # the theme's cmd/pagehistory (it needs the full git history);
    # modification from git (enableGitInfo).
    history: true
    contextMenu:
      enable: false

  highlight:
    copy:
      enable: true
      display: hover

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
